<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Studio</title>
<style>
  :root {
    --bg: #f5f5f3; --panel: rgba(255,255,255,0.82);
    --border: rgba(0,0,0,0.06); --text: #2a2a28;
    --muted: #888; --accent: #b58d57;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "Helvetica Neue", -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  .panel {
    position: absolute; background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 14px 18px; font-size: 12px; line-height: 1.7;
    letter-spacing: 0.02em;
  }

  /* Products list: bottom-left */
  #products { bottom: 20px; left: 20px; width: 240px; max-height: 50vh;
    display: flex; flex-direction: column; padding: 12px 0; }
  #products .list { flex: 1; overflow-y: auto; padding: 0; }
  #products .item { padding: 8px 16px; cursor: pointer; font-size: 11px;
    border-left: 2px solid transparent; transition: background 0.1s; }
  #products .item:hover { background: rgba(181,141,87,0.06); }
  #products .item.active { background: rgba(181,141,87,0.12);
    border-left-color: var(--accent); }
  #products .item .name { font-weight: 500; color: #333;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #products .empty { padding: 16px; font-size: 11px; color: #aaa;
    text-align: center; }

  /* Dimensions: bottom-right */
  #dims { bottom: 20px; right: 20px; font-variant-numeric: tabular-nums;
    text-align: right; min-width: 180px; }
  #dims .unit-toggle { display: flex; gap: 0; margin: 0 0 10px 0;
    border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; overflow: hidden; }
  #dims .unit-toggle button { flex: 1; padding: 5px 0; border: none;
    background: transparent; cursor: pointer; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #999;
    font-family: inherit; transition: all 0.15s; }
  #dims .unit-toggle button:hover { color: #555; }
  #dims .unit-toggle button.on { color: var(--accent);
    background: rgba(181,141,87,0.12); cursor: default; }
  #dims .d { display: flex; justify-content: space-between; font-size: 12px;
    padding: 1px 0; }
  #dims .d span:first-child { color: #888; }
  #dims .d span:last-child { color: #333; }

  @media (max-width: 640px) {
    #products { width: calc(100vw - 40px); max-height: 30vh; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel" id="products">
  <div class="list" id="list">
    <div class="empty">読み込み中…</div>
  </div>
</div>

<div class="panel" id="dims">
  <div class="unit-toggle">
    <button data-unit="cm" class="on">cm</button>
    <button data-unit="in">inch</button>
  </div>
  <div class="d"><span>W (幅)</span><span id="dW">—</span></div>
  <div class="d"><span>D (奥行)</span><span id="dD">—</span></div>
  <div class="d"><span>H (高さ)</span><span id="dH">—</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MANIFEST_URL = new URL('./products.json', window.location.href).href;

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f5f3);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(1.6, 1.35, 1.7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, -0.2);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.5; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.5 - 0.02;
controls.update();

// Cyclorama
function makeCycGeometry() {
  const width = 8, floorNear = 3, floorFar = -1.0, radius = 0.45, wallTop = 3.2;
  const profile = [];
  for (let i = 0; i <= 6; i++) { const t = i/6;
    profile.push([floorNear + (floorFar - floorNear) * t, 0]); }
  for (let i = 1; i <= 28; i++) { const t = i/28; const a = (Math.PI/2) * t;
    profile.push([floorFar - radius * Math.sin(a), radius * (1 - Math.cos(a))]); }
  const wallZ = floorFar - radius;
  for (let i = 1; i <= 12; i++) { const t = i/12;
    profile.push([wallZ, radius + (wallTop - radius) * t]); }
  const xSeg = 4, verts = [];
  for (let xi = 0; xi <= xSeg; xi++) {
    const x = -width/2 + width * xi / xSeg;
    for (const [z, y] of profile) verts.push(x, y, z);
  }
  const idx = [], pc = profile.length;
  for (let xi = 0; xi < xSeg; xi++) for (let pi = 0; pi < pc - 1; pi++) {
    const a = xi*pc + pi, b = a + 1, c = a + pc, d = c + 1;
    idx.push(a, c, b, c, d, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const cycMat = new THREE.MeshStandardMaterial({
  color: 0xeeece8, roughness: 0.92, metalness: 0, side: THREE.DoubleSide });
const cyc = new THREE.Mesh(makeCycGeometry(), cycMat);
cyc.receiveShadow = true; scene.add(cyc);

// Lighting
const key = new THREE.DirectionalLight(0xfff7ec, 2.2);
key.position.set(-1.8, 2.4, 1.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003;
const s = 2.2;
key.shadow.camera.left = -s; key.shadow.camera.right = s;
key.shadow.camera.top = s; key.shadow.camera.bottom = -s;
key.shadow.camera.near = 0.1; key.shadow.camera.far = 8; key.shadow.radius = 8;
scene.add(key);
scene.add(Object.assign(new THREE.DirectionalLight(0xffffff, 0.55), { position: new THREE.Vector3(2.0, 1.2, 0.8) }));
scene.add(Object.assign(new THREE.DirectionalLight(0xffe9c8, 1.0), { position: new THREE.Vector3(0.2, 1.4, -2.0) }));
scene.add(new THREE.AmbientLight(0xffffff, 0.06));

// Desk
const desk = new THREE.Group();
const W = 1.4, D = 0.7, H = 0.72, T = 0.025;
const woodMat = new THREE.MeshStandardMaterial({ color: 0xe2dccd, roughness: 0.75, metalness: 0 });
const legMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2a, roughness: 0.55, metalness: 0.2 });
const topMesh = new THREE.Mesh(new THREE.BoxGeometry(W, T, D), woodMat);
topMesh.position.y = H - T/2; topMesh.castShadow = true; topMesh.receiveShadow = true; desk.add(topMesh);
const legSize = 0.028, legH = H - T, inset = 0.04;
const legGeom = new THREE.BoxGeometry(legSize, legH, legSize);
[
  [-W/2+inset+legSize/2, legH/2, -D/2+inset+legSize/2],
  [ W/2-inset-legSize/2, legH/2, -D/2+inset+legSize/2],
  [-W/2+inset+legSize/2, legH/2,  D/2-inset-legSize/2],
  [ W/2-inset-legSize/2, legH/2,  D/2-inset-legSize/2],
].forEach(p => {
  const m = new THREE.Mesh(legGeom, legMat);
  m.position.set(...p); m.castShadow = true; desk.add(m);
});
desk.position.set(0, 0, 0.1);
scene.add(desk);

// Mannequin
const mannequin = new THREE.Group();
const mannMat = new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.78, metalness: 0 });
function capsule(r, len, pos) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 16), mannMat);
  m.position.set(...pos); m.castShadow = true; m.receiveShadow = true; mannequin.add(m); return m;
}
capsule(0.05, 0.34, [-0.085, 0.28, 0]);
capsule(0.05, 0.34, [ 0.085, 0.28, 0]);
capsule(0.075, 0.30, [-0.085, 0.725, 0]);
capsule(0.075, 0.30, [ 0.085, 0.725, 0]);
const pelvis = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.04, 6, 16), mannMat);
pelvis.scale.set(1.25, 1.0, 0.7); pelvis.position.set(0, 0.97, 0);
pelvis.castShadow = true; pelvis.receiveShadow = true; mannequin.add(pelvis);
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.22, 8, 20), mannMat);
torso.scale.set(1.1, 1.0, 0.6); torso.position.set(0, 1.22, 0);
torso.castShadow = true; torso.receiveShadow = true; mannequin.add(torso);
capsule(0.05, 0.22, [-0.21, 1.30, 0.02]);
capsule(0.05, 0.22, [ 0.21, 1.30, 0.02]);
capsule(0.045, 0.22, [-0.21, 1.02, 0.04]);
capsule(0.045, 0.22, [ 0.21, 1.02, 0.04]);
capsule(0.045, 0.04, [0, 1.535, 0]);
const head = new THREE.Mesh(new THREE.CapsuleGeometry(0.10, 0.06, 8, 20), mannMat);
head.position.set(0, 1.66, 0); head.scale.set(0.95, 1.0, 1.0);
head.castShadow = true; head.receiveShadow = true; mannequin.add(head);
const footGeom = new THREE.BoxGeometry(0.10, 0.04, 0.22);
[-0.085, 0.085].forEach(x => {
  const f = new THREE.Mesh(footGeom, mannMat);
  f.position.set(x, 0.02, 0.025);
  f.castShadow = true; f.receiveShadow = true; mannequin.add(f);
});
mannequin.position.set(0, 0, -0.85);
scene.add(mannequin);

// Brass material (locked design)
const brassMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0xb5a988).lerp(new THREE.Color(0xd6a55a), 0.5),
  metalness: 1.0, roughness: 0.35, envMapIntensity: 1.0,
  side: THREE.DoubleSide,
});
function applyBrass(root) {
  root.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; n.material = brassMat; } });
}

// Product placement
let currentObject = null;
let currentSizeMeters = null;
let currentUnit = 'cm';
function formatDim(meters) {
  if (currentUnit === 'cm') return (meters * 100).toFixed(1) + ' cm';
  return (meters * 39.3700787).toFixed(2) + ' in';
}
function updateDimsDisplay() {
  if (!currentSizeMeters) return;
  document.getElementById('dW').textContent = formatDim(currentSizeMeters.w);
  document.getElementById('dD').textContent = formatDim(currentSizeMeters.d);
  document.getElementById('dH').textContent = formatDim(currentSizeMeters.h);
}
function placeOnDesk(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  obj.position.x -= center.x;
  obj.position.z -= center.z - desk.position.z;
  obj.position.y -= box.min.y;
  obj.position.y += H;
  currentSizeMeters = { w: size.x, d: size.z, h: size.y };
  updateDimsDisplay();
}
function setActiveObject(obj) {
  if (currentObject) scene.remove(currentObject);
  currentObject = obj;
  scene.add(currentObject);
  placeOnDesk(currentObject);
}

// Products library
const loader = new GLTFLoader();
const products = [];
let activeId = null;
let nextId = 1;

const $list = document.getElementById('list');
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderList() {
  if (products.length === 0) {
    $list.innerHTML = `<div class="empty">商品が登録されていません</div>`;
    return;
  }
  $list.innerHTML = '';
  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item' + (p.id === activeId ? ' active' : '');
    div.innerHTML = `<div class="name">${escapeHtml(p.name)}</div>`;
    div.addEventListener('click', () => selectProduct(p.id));
    $list.appendChild(div);
  });
}
async function loadProduct(p) {
  if (p.sceneCache) return p.sceneCache;
  const gltf = await loader.loadAsync(p.url);
  p.sceneCache = gltf.scene;
  return p.sceneCache;
}
async function selectProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  activeId = id;
  renderList();
  try {
    const sceneObj = await loadProduct(p);
    const inst = sceneObj.clone(true);
    applyBrass(inst);
    setActiveObject(inst);
  } catch (err) {
    console.error('Load error', err);
  }
}
async function loadManifest() {
  try {
    const res = await fetch(MANIFEST_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Manifest fetch failed: ${res.status}`);
    const manifest = await res.json();
    const base = new URL(MANIFEST_URL, window.location.href);
    (manifest.products || []).forEach(item => {
      products.push({
        id: nextId++,
        name: item.name || item.url.split('/').pop(),
        url: new URL(item.url, base).href,
        sceneCache: null,
      });
    });
    renderList();
    if (products.length > 0) selectProduct(products[0].id);
  } catch (err) {
    console.error('Manifest load error', err);
    $list.innerHTML = `<div class="empty">商品リストを読み込めませんでした</div>`;
  }
}

// Unit toggle
document.querySelectorAll('#dims .unit-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const u = btn.dataset.unit;
    if (u === currentUnit) return;
    currentUnit = u;
    document.querySelectorAll('#dims .unit-toggle button').forEach(b => {
      b.classList.toggle('on', b.dataset.unit === currentUnit);
    });
    updateDimsDisplay();
  });
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
(function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
})();

loadManifest();
</script>
</body>
</html>
